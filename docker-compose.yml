services:
  disney-wait-times:
    build: .
    container_name: disney-wait-times
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/api/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
